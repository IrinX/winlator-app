apply plugin: 'com.android.application'

android {
    namespace 'com.winlator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 28
        versionName "11.1"
    }

    buildTypes {
        debug {
            minifyEnabled false

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lint {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    packagingOptions {
        // midihandler 通过 CMake IMPORTED 引用 jniLibs 中的预编译第三方 .so
        //（FLAC/fluidsynth/ogg/vorbis 等），AGP 会同时从 jniLibs 和 cxx 产物
        // 收集到同名 .so 触发 DuplicateRelativeFileException。这些同名库内容一致，
        // 取任一份即可；winlator 自编的 .so 不在 jniLibs，不会被误伤。
        pickFirst 'lib/arm64-v8a/*.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
